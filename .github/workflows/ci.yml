name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: api
            dockerfile: Dockerfile.multi
          - service: notifier
            dockerfile: Dockerfile
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Nom de l'image (minuscules)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/${{ matrix.dockerfile }}
          load: true
          tags: ${{ env.IMAGE }}:ci

      - name: Scan Trivy ${{ matrix.service }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
          format: table

      - name: Login GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push ${{ matrix.service }}:${{ github.ref_name }}
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker tag "$IMAGE:ci" "$IMAGE:${{ github.ref_name }}"
          docker push "$IMAGE:${{ github.ref_name }}"

  deploy:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Préparer la configuration (.env + secret)
        run: |
          cp .env.example .env
          mkdir -p secrets
          openssl rand -base64 24 | tr -d '\n' > secrets/db_password.txt

      - name: Déployer (docker compose pull + up)
        run: |
          docker compose pull
          docker compose up -d --no-build --wait

      - name: Vérifier la stack déployée
        run: |
          docker compose ps
          curl -sf localhost:8080/health
          echo
          curl -s -X POST localhost:8080/products -H "Content-Type: application/json" \
            -d '{"name":"Deploy check","price_cents":100}'
          echo
          sleep 2
          docker compose logs notifier | tail -5
